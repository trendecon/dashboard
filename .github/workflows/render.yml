name: render

# Daily render of the trendEcon dashboard. Replaces the old tic-based pipeline.
#  - reads the latest series from the trendecon/data repo (over https)
#  - renders docs/index.Rmd to docs/index.html
#  - commits the html to master, where GitHub Pages serves it as www.trendecon.org
#  - binary package installs from Posit Package Manager (no source compilation,
#    which is what the old tic stack died on)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dashboard-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::rmarkdown
            cran::knitr
            cran::flexdashboard
            cran::dygraphs
            cran::xts
            cran::zoo
            cran::tsbox
            cran::dplyr
            cran::readr
            cran::htmlwidgets
            cran::dataseries
          cache-version: 1

      - name: Render dashboard
        run: Rscript -e 'rmarkdown::render("docs/index.Rmd")'

      - name: Commit & push docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render dashboard $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

  notify:
    name: notify on failure
    needs: render
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The dashboard render failed on $(date -u +%Y-%m-%d). Logs: ${run_url}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'Dashboard render failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Dashboard render failed" --body "$body"
          fi
